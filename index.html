<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>نظام إدارة نتائج الطلاب</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Arial;
  background: #010a14;
  color: #e8f6f5;
  padding: 10px;
  margin: 0;
}
.card {
  background: #071a2e;
  width: 100%;
  max-width: 650px;
  margin: auto;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.7);
  border: 1px solid #123a52;
}
h1 { text-align: center; color: #67e8f9; margin-bottom: 5px; }
.subtitle { text-align: center; color: #8fb8c9; font-size: 14px; margin-bottom: 20px; }
h3 { color: #67e8f9; }
label { display: block; margin: 12px 0 5px; font-size: 14px; color: #c2dbe6; }
input {
  display: block;
  width: 100%;
  padding: 13px;
  background: #020d1a;
  color: white;
  border: 1px solid #16425b;
  border-radius: 12px;
  outline: none;
  font-size: 15px;
}
input:focus { border-color: #22d3ee; box-shadow: 0 0 0 2px #22d3ee33; }
input::placeholder { color: #5f7f91; }
button {
  width: 100%;
  padding: 14px;
  margin-top: 18px;
  background: #0891b2;
  color: white;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}
button:hover { background: #06b6d4; }
table { width: 100%; border-collapse: collapse; margin-top: 25px; font-size: 14px; }
th { background: #0e7490; color: white; padding: 12px 8px; }
td { padding: 12px 8px; border-bottom: 1px solid #123a52; text-align: center; }
tr:nth-child(even) { background: #0a2438; }
.delete-btn { width: auto; padding: 7px 14px; margin: 0; background: #e11d48; color: white; font-size: 13px; }
.success { color: #5eead4; font-weight: bold; }
.fail { color: #fb7185; font-weight: bold; }
.mercy { background: #020d1a; padding: 18px; border-radius: 15px; margin-top: 20px; text-align: center; border: 1px solid #123a52; }
.mercy h3 { margin-top: 0; }
/* للموبايل */
@media (max-width: 600px) {
  body {
    padding: 10px !important;
  }
  .card {
    padding: 15px !important;
    border-radius: 15px !important;
  }
  h1 {
    font-size: 22px !important;
  }
  table {
    display: block !important;
    overflow-x: auto !important;
    white-space: nowrap !important;
  }
  input, select, button {
    font-size: 16px !important;
  }
}
</style>
</head>
<body>
 <!-- نافذة اختيار النوع -->
<div id="genderPopup" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; display:flex; align-items:center; justify-content:center;">
  <div style="background:white; padding:30px; border-radius:20px; text-align:center; width:90%; max-width:350px;">
    <h2 style="margin-bottom:10px;">أهلاً بيك! 👋</h2>
    <p style="margin-bottom:20px;">تحب نكلمك بأي صيغة؟</p>
    <button onclick="chooseGender('male')" style="padding:12px 20px; font-size:18px; margin:5px; border-radius:10px; cursor:pointer; border:none; background:#4da6ff; color:white;">مذكر</button>
    <button onclick="chooseGender('female')" style="padding:12px 20px; font-size:18px; margin:5px; border-radius:10px; cursor:pointer; border:none; background:#ff7eb9; color:white;">مؤنث</button>
  </div>
</div> 
  <!-- نافذة اختيار الدور -->
<div id="rolePopup" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; align-items:center; justify-content:center;">
  <div style="background:white; padding:30px; border-radius:20px; text-align:center; width:90%; max-width:350px;">
    <h2 style="margin-bottom:10px;">انت مين؟ 🎓</h2>
    <p style="margin-bottom:20px;">اختار دورك عشان نظبطلك الموقع</p>
    <button id="studentBtn" onclick="chooseRole('student')" style="padding:12px 20px; font-size:18px; margin:5px; border-radius:10px; cursor:pointer; border:none; background:#4da6ff; color:white;">Student</button>
    <button id="teacherBtn" onclick="chooseRole('teacher')" style="padding:12px 20px; font-size:18px; margin:5px; border-radius:10px; cursor:pointer; border:none; background:#ff7eb9; color:white;">Teacher</button>
  </div>
</div>
<div class="card">
<h1>🎓 نظام إدارة نتائج الطلاب</h1>
<p class="subtitle">تابع درجاتك - تقديرك - نتيجتك في مكان واحد</p>

<div id="addForm">
<h3>إضافة طالب جديد</h3>

<label>ID الطالب</label>
<input id="studentId" type="number" placeholder="مثال: 5">

<label>اسم الطالب</label>
<input id="name" placeholder="مثال: نور">

<label>الدرجة الأولى</label>
<input id="g1" type="number" placeholder="مثال: 85">

<label>الدرجة الثانية</label>
<input id="g2" type="number" placeholder="مثال: 90">

<label>الدرجة الثالثة</label>
<input id="g3" type="number" placeholder="مثال: 88">

<label>نسبة الحضور %</label>
<input id="att" type="number" placeholder="مثال: 95">

<button id="addBtn" onclick="addStudent()">+ إضافة طالب</button>
</div>
<table>
<thead>
<tr><th>ID</th><th>الاسم</th><th>المتوسط</th><th>التقدير</th><th>النتيجة</th><th id="delHeader">حذف</th></tr></thead>
<tbody id="studentsTable"></tbody>
</table>

<div class="mercy" id="mercyBox"></div>
</div>
<script src="main.js"></script>
</body>
</html>
